version: '3.8'

services:
  api:
    build: .
    container_name: task-api
    ports:
      - "8089:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/data/tasks.db
      - JWT_SECRET=my-super-secret-key-that-is-32-chars!!
      - TOKEN_EXPIRY_HRS=24
      - ENV=development
      - READ_TIMEOUT=5
      - WRITE_TIMEOUT=10
    volumes:
      - task-api-data:/app/data
    networks:
      - task-api-network
    healthcheck:
      test: ["CMD", "wget", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  task-api-data:
    name: task-api-data

networks:
  task-api-network:
    name: task-api-network
    driver: bridge